<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Area riservata | SELCRU</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{--ind:#4338ca;--ind2:#312e81;--ind-soft:#eef0fd;--cream:#faf6f0;--ink:#1a1a1a;--ink2:#5c5752;--ink3:#8a847d;--line:#e8e1d6;--card:#fff;--ok:#1f7a4d;--ok-soft:#e3f3ea;--warn:#9a6b12;--warn-soft:#fbf1dc;--bad:#b2302a;--wine:#7a1730}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Jost,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{font-family:Lexend,Jost,sans-serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ind)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
@media(min-width:760px){.wrap{padding:0 28px}}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:30px;width:auto}
.brand .wm{font:700 15px/1 Lexend,sans-serif;letter-spacing:.14em;color:var(--ind)}
.brand .sub{font-size:13px;color:var(--ink2)}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.who b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ind);color:var(--ind)}
.btn.pri{background:var(--ind);border-color:var(--ind);color:#fff}
.btn.pri:hover{background:var(--ind2);border-color:var(--ind2);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ind);outline-offset:2px}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lbox{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 28px;box-shadow:0 10px 40px -20px rgba(40,30,80,.25)}
.lbox h1{font-size:28px;margin:18px 0 6px}
.lbox p{color:var(--ink2);margin:0 0 20px;font-size:14px}
.lbox label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.lbox input{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:12px 14px;font-size:16px;letter-spacing:.04em}
.lbox .btn{width:100%;margin-top:14px;padding:12px}
.err{color:var(--bad);font-size:14px;min-height:1.5em;margin-top:10px}
.back{display:block;text-align:center;margin-top:18px;font-size:14px;color:var(--ink2)}
/* app */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:16px 4px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ind);border-color:var(--ind);color:#fff}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;border-radius:999px;background:var(--ind-soft);color:var(--ind);font-size:12px;padding:0 6px}
.tab[aria-selected="true"] .n{background:#fff}
main{padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card h2{font-size:20px}
.card h3{font-size:16px}
.muted{color:var(--ink2);font-size:14px}
.small{font-size:13px;color:var(--ink3)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;margin-top:10px}
.kv div span{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.kv div b{font-weight:500}
.tblw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:none}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--ind-soft);color:var(--ind)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.steps{display:flex;gap:4px;margin:12px 0 4px;flex-wrap:wrap}
.steps span{flex:1 1 90px;text-align:center;font-size:12px;padding:6px 4px;border-radius:8px;background:#f3eee6;color:var(--ink3)}
.steps span.done{background:var(--ind-soft);color:var(--ind)} .steps span.now{background:var(--ind);color:#fff;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px}
.filters input{flex:1 1 220px}
.prod{margin-top:18px}
.prod h3{font-size:18px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qty{width:70px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:right;background:#fff}
details summary{cursor:pointer;color:var(--ind);font-size:13px}
details p{margin:6px 0 0;font-size:13.5px;color:var(--ink2)}
.cartbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:9}
.cartbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.form label{font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.form input{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
ul.ist{margin:8px 0 0;padding-left:20px} ul.ist li{margin:4px 0}
.doc{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.doc:last-child{border-bottom:none}
.empty{color:var(--ink3);font-style:italic}
</style>
</head>

const LOGO = "https://selcru.com/brand/selcru-logo.svg";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => (n == null || isNaN(n)) ? "" : new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const eurEN = n => (n == null || isNaN(n)) ? "" : new Intl.NumberFormat("en-US",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const dataIT = d => { if(!d) return ""; const [y,m,g] = String(d).split("-"); return g ? `${g}/${m}/${y}` : d; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const root = document.getElementById("root");

/* ---------- login ---------- */
function loginView(msg){
  root.innerHTML = `<div class="login"><form class="lbox" id="lf" autocomplete="off">
    <div class="brand"><img src="${LOGO}" alt="SELCRU" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'wm',textContent:'SELCRU'}))"></div>
    <h1>Area riservata</h1>
    <p>Partner, cantine e team Selcru. Inserisci la password che hai ricevuto: vedrai solo quello che riguarda te.<br><span class="small">Partners and producers: enter the password you received.</span></p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn pri" type="submit" id="go">Entra</button>
    <div class="err" id="err" role="alert">${esc(msg||"")}</div>
    <a class="back" href="index.html">← Torna al catalogo</a>
  </form></div>`;
  const f = document.getElementById("lf");
  document.getElementById("pw").focus();
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "Verifica…"; err.textContent = "";
    try{
      const p = await apri(document.getElementById("pw").value.trim());
      if(!p){ err.textContent = "Password non riconosciuta. Password not recognised."; btn.disabled = false; btn.textContent = "Entra"; return; }
      avvia(p);
    }catch(x){ err.textContent = "Il browser non supporta la cifratura: prova con Chrome, Edge, Safari o Firefox aggiornati."; btn.disabled = false; btn.textContent = "Entra"; }
  });
}
async function apri(pw){
  if(!pw) return null;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(VAULT.s), iterations:VAULT.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  for(const v of VAULT.v){
    try{
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(v.i)}, key, b64(v.c));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(_){}
  }
  return null;
}
function avvia(p){
  if(p.ruolo === "admin"){ document.open(); document.write(p.html); document.close(); return; }
  if(p.ruolo === "agente") return agente(p);
  if(p.ruolo === "cantina") return cantina(p);
}
function testata(sub, nome, extra){
  return `<header class="top"><div class="wrap">
    <div class="brand"><img src="${LOGO}" alt="SELCRU" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'wm',textContent:'SELCRU'}))"><span class="sub">${esc(sub)}</span></div>
    <div class="who">${extra||""}<b>${esc(nome)}</b><button class="btn sm" type="button" id="esci">Esci</button></div></div></header>`;
}
function bindEsci(){ document.getElementById("esci").onclick = () => location.reload(); }
function schede(list, cur){
  return `<nav class="tabs" role="tablist">${list.map(([k,l,n])=>`<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${k===cur}">${esc(l)}${n!=null?`<span class="n">${n}</span>`:""}</button>`).join("")}</nav>`;
}

/* ---------- AGENTE (inglese) ---------- */
function agente(p){
  const d = p.dati, L = d.listino || [], C = d.cantine || [];
  const nomeVino = id => { const v = L.find(x=>x.vino===id); return v ? `${v.cantina_nome} · ${v.nome}${v.annata?` ${v.annata}`:""}` : id; };
  const cart = {}; let tab = "list", fP = "", fQ = "";
  const fasi = Object.fromEntries((d.fasi||[["richiesta","Request"],["po","POs to wineries"],["documenti","Documents"],["spedito","Shipped"],["chiuso","Closed"]]).map(x=>x));
  const EN = {richiesta:"Request", po:"POs to wineries", documenti:"Documents", spedito:"Shipped", chiuso:"Closed"};
  const ordFasi = ["richiesta","po","documenti","spedito","chiuso"];
  function draw(){
    const nCart = Object.values(cart).reduce((a,b)=>a+b,0);
    root.innerHTML = testata("Partner area", d.agente.nome, `<span class="small">${esc(d.agente.mercato||"")}</span>`) +
      `<main class="wrap">${schede([["list","Price list",L.length],["prod","Producers",C.length],["ord","My orders",(d.ordini||[]).length],["hist","History",null],["cart","Order request",nCart||null]], tab)}<div id="pane"></div></main>` +
      (nCart && tab!=="cart" ? `<div class="cartbar"><div class="wrap"><span><b>${nCart}</b> cases in your request</span><button class="btn pri" type="button" data-tab="cart">Review request →</button></div></div>` : "");
    bindEsci();
    root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; draw(); });
    const pane = document.getElementById("pane");
    if(tab==="list") pane.innerHTML = listino(), bindListino();
    if(tab==="prod") pane.innerHTML = produttori();
    if(tab==="ord") pane.innerHTML = ordini();
    if(tab==="hist") pane.innerHTML = hist();
    if(tab==="cart") pane.innerHTML = carrello(), bindCarrello();
  }
  function listino(){
    const prods = [...new Set(L.map(v=>v.cantina_nome))].sort((a,b)=>a.localeCompare(b));
    const q = fQ.toLowerCase();
    const rows = L.filter(v => (!fP || v.cantina_nome===fP) && (!q || `${v.nome} ${v.cantina_nome} ${v.uve} ${v.tipo}`.toLowerCase().includes(q)));
    const byP = {}; rows.forEach(v => (byP[v.cantina_nome] ||= []).push(v));
    return `<div class="card"><h2>Your price list</h2><p class="muted">Ex cellar prices per bottle, in euro. The samples column is the discount granted on the line. Where a price is not set yet it says “price on request”.</p>
      <div class="filters"><select id="fp" aria-label="Producer"><option value="">All producers</option>${prods.map(x=>`<option ${x===fP?"selected":""}>${esc(x)}</option>`).join("")}</select>
      <input id="fq" type="search" placeholder="Search wine, grape, producer" value="${esc(fQ)}" aria-label="Search"></div>
      ${Object.keys(byP).sort((a,b)=>a.localeCompare(b)).map(pn=>`<div class="prod"><h3>${esc(pn)}<span class="small">${(C.find(c=>c.nome===pn)||{}).zona||""}</span></h3>
        <div class="tblw"><table><thead><tr><th>Wine</th><th>Vintage</th><th class="n">Alc.</th><th class="n">Price / btl</th><th class="n">Samples</th><th class="n">Cases</th></tr></thead><tbody>
        ${byP[pn].map(v=>`<tr><td><b>${esc(v.nome)}</b>${v.tipo?` <span class="small">· ${esc(v.tipo)}</span>`:""}
          ${(v.uve||v.degustazione||v.abbinamenti)?`<details><summary>Details</summary>${v.uve?`<p><b>Grapes:</b> ${esc(v.uve)}</p>`:""}${v.degustazione?`<p><b>Tasting:</b> ${esc(v.degustazione)}</p>`:""}${v.abbinamenti?`<p><b>Pairings:</b> ${esc(v.abbinamenti)}</p>`:""}</details>`:""}</td>
          <td>${esc(v.annata||"")}</td><td class="n">${v.grado?esc(v.grado)+"%":""}</td>
          <td class="n">${v.prezzo_eur!=null?eurEN(v.prezzo_eur):'<span class="small">price on request</span>'}</td>
          <td class="n">${v.sconto_campioni_pct?esc(v.sconto_campioni_pct)+"%":""}</td>
          <td class="n"><input class="qty" type="number" min="0" step="1" inputmode="numeric" data-v="${esc(v.vino)}" value="${cart[v.vino]||""}" aria-label="Cases of ${esc(v.nome)}"></td></tr>`).join("")}
        </tbody></table></div></div>`).join("") || '<p class="empty">No wines match.</p>'}</div>`;
  }
  function bindListino(){
    document.getElementById("fp").onchange = e => { fP = e.target.value; draw(); };
    const fq = document.getElementById("fq"); fq.oninput = e => { fQ = e.target.value; const pos = e.target.selectionStart; draw(); const n = document.getElementById("fq"); n.focus(); n.setSelectionRange(pos,pos); };
    root.querySelectorAll(".qty").forEach(i => i.onchange = () => { const n = Math.max(0, parseInt(i.value)||0); if(n) cart[i.dataset.v]=n; else delete cart[i.dataset.v]; draw(); });
  }
  function produttori(){
    return `<div class="grid">${C.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<div class="card"><h3>${esc(c.nome)}</h3>
      <p class="small">${esc([c.zona,c.comune].filter(Boolean).join(" · "))}</p>
      ${c.storia?`<p class="muted">${esc(c.storia)}</p>`:""}
      <div class="kv"><div><span>Terms</span><b>${esc(c.resa||"")}</b></div><div><span>Cases per pallet</span><b>${esc(c.cartoni_per_bancale||"")}</b></div><div><span>Wines</span><b>${L.filter(v=>v.cantina===c.id).length}</b></div></div></div>`).join("")}</div>`;
  }
  function righeOrdine(r){
    let lordo=0, camp=0;
    const tr = r.map(x=>{ const tot=(x.cartoni||0)*(x.bottiglie_per_cartone||12)*(x.prezzo_eur||0); const s=tot*(x.sconto_campioni_pct||0)/100; lordo+=tot; camp+=s;
      return `<tr><td>${esc(nomeVino(x.vino))}</td><td class="n">${x.cartoni}</td><td class="n">${(x.cartoni||0)*(x.bottiglie_per_cartone||12)}</td><td class="n">${eurEN(x.prezzo_eur)}</td><td class="n">${eurEN(tot)}</td></tr>`; }).join("");
    return `<div class="tblw"><table><thead><tr><th>Wine</th><th class="n">Cases</th><th class="n">Bottles</th><th class="n">Price / btl</th><th class="n">Total</th></tr></thead><tbody>${tr}
      ${camp?`<tr><td colspan="4">Samples discount</td><td class="n">−${eurEN(camp)}</td></tr>`:""}<tr class="tot"><td colspan="4">Total</td><td class="n">${eurEN(lordo-camp)}</td></tr></tbody></table></div>`;
  }
  function ordini(){
    const O = d.ordini||[];
    if(!O.length) return '<div class="card"><p class="empty">No open orders.</p></div>';
    return O.map(o=>{ const i = ordFasi.indexOf(o.stato);
      return `<div class="card"><h2>${esc(o.id)}</h2><p class="muted">Date ${dataIT(o.data)} · market ${esc(o.mercato||"")}${o.ritiro?` · pick up from ${dataIT(o.ritiro)}`:""}</p>
      <div class="steps">${ordFasi.map((k,j)=>`<span class="${j<i?"done":j===i?"now":""}">${EN[k]}</span>`).join("")}</div>${righeOrdine(o.righe||[])}</div>`; }).join("");
  }
  function hist(){
    const S = d.storico_ordini||[]; if(!S.length) return '<div class="card"><p class="empty">No history yet.</p></div>';
    const by = {}; S.forEach(x => (by[x.ordine] ||= {data:x.data, r:[]}).r.push(x));
    return Object.entries(by).sort((a,b)=>String(b[1].data).localeCompare(String(a[1].data))).map(([k,o])=>`<div class="card"><h3>${esc(k)} <span class="small">· ${dataIT(o.data)}</span></h3>${righeOrdine(o.r)}</div>`).join("");
  }
  function carrello(){
    const ids = Object.keys(cart);
    if(!ids.length) return '<div class="card"><h2>Order request</h2><p class="empty">Your request is empty. Add cases from the price list.</p></div>';
    const r = ids.map(id=>{ const v=L.find(x=>x.vino===id)||{}; return {vino:id, cartoni:cart[id], bottiglie_per_cartone:12, prezzo_eur:v.prezzo_eur, sconto_campioni_pct:v.sconto_campioni_pct||0}; });
    const byP = {}; r.forEach(x=>{ const v=L.find(y=>y.vino===x.vino)||{}; byP[v.cantina]=(byP[v.cantina]||0)+x.cartoni; });
    const pal = Object.entries(byP).map(([cid,n])=>{ const c=C.find(y=>y.id===cid)||{}; const cpp=c.cartoni_per_bancale||56; return `${esc(c.nome||cid)}: ${n} cases (${Math.ceil(n/cpp)} pallet${Math.ceil(n/cpp)>1?"s":""}, ${cpp} cases each)`; });
    return `<div class="card"><h2>Order request</h2><p class="muted">This is a request, not an order yet: Selcru checks availability and vintages with the wineries and confirms. Lines marked “price on request” get a quote.</p>
      ${righeOrdine(r)}<p class="small">${pal.join(" · ")}</p>
      <label class="muted" for="note">Notes (customer, delivery, special prices)</label><textarea id="note"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" type="button" id="send">Send request by e-mail</button><button class="btn" type="button" id="copy">Copy text</button><button class="btn" type="button" id="clear">Clear</button></div>
      <p class="small" id="st"></p></div>`;
  }
  function testoRichiesta(){
    const ids = Object.keys(cart);
    const righe = ids.map(id=>{ const v=L.find(x=>x.vino===id)||{}; return `- ${cart[id]} cases x 12 · ${v.cantina_nome} · ${v.nome}${v.annata?" "+v.annata:""} · ${v.prezzo_eur!=null?eurEN(v.prezzo_eur)+"/btl":"price on request"}`; });
    const note = (document.getElementById("note")||{}).value||"";
    return `Order request from ${d.agente.nome} (${d.agente.mercato||""})\n\n${righe.join("\n")}\n\nTotal cases: ${ids.reduce((a,k)=>a+cart[k],0)}${note?`\n\nNotes:\n${note}`:""}\n`;
  }
  function bindCarrello(){
    const s = document.getElementById("send"); if(!s) return;
    s.onclick = () => { location.href = `mailto:${p.contatto}?subject=${encodeURIComponent("Order request - "+d.agente.nome)}&body=${encodeURIComponent(testoRichiesta())}`; };
    document.getElementById("copy").onclick = async () => { try{ await navigator.clipboard.writeText(testoRichiesta()); document.getElementById("st").textContent="Copied."; }catch(_){ document.getElementById("st").textContent="Select and copy the lines above."; } };
    document.getElementById("clear").onclick = () => { for(const k in cart) delete cart[k]; draw(); };
  }
  draw();
}

/* ---------- CANTINA (italiano) ---------- */
function cantina(p){
  const d = p.dati, c = d.cantina, V = d.vini||[], O = (d.ordini||[]).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))), K = p.comune||{};
  const fasi = K.fasi_ordine || [["richiesta","Richiesta"],["po","PO alle cantine"],["documenti","Documenti"],["spedito","Spedito"],["chiuso","Chiuso"]];
  const nomeVino = id => { const v = V.find(x=>x.id===id); return v ? `${v.nome}${v.annata?` ${v.annata}`:""}${v.grado?` · ${v.grado}%`:""}` : id; };
  let tab = O.length ? "ord" : "vini";
  const oggetto = (o, cosa) => `${o?o+" - ":""}${cosa} - ${String(c.nome).toUpperCase()}`;
  const mail = (subj, body) => `mailto:${p.contatto}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body||"")}`;
  function draw(){
    root.innerHTML = testata("Area cantine", c.nome, "") +
      `<main class="wrap">${schede([["ord","I tuoi ordini",O.length],["doc","Documenti",null],["sped","Istruzioni di spedizione",null],["vini","I tuoi vini",V.length],["dati","I tuoi dati",null]], tab)}<div id="pane"></div></main>`;
    bindEsci();
    root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; draw(); });
    const pane = document.getElementById("pane");
    if(tab==="ord") pane.innerHTML = ordini(), bindOrdini();
    if(tab==="doc") pane.innerHTML = documenti();
    if(tab==="sped") pane.innerHTML = spedizione();
    if(tab==="vini") pane.innerHTML = vini();
    if(tab==="dati") pane.innerHTML = dati();
  }
  function righe(o){
    let lordo=0, camp=0;
    const tr=(o.righe||[]).map(x=>{ const bt=(x.cartoni||0)*(x.bottiglie_per_cartone||12); const tot=bt*(x.prezzo_acquisto_eur||0); const s=Math.round(tot*(x.sconto_campioni_pct||0))/100; lordo+=tot; camp+=s;
      return `<tr><td>${esc(nomeVino(x.vino))}</td><td class="n">${x.cartoni}</td><td class="n">${bt}</td><td class="n">${eur(x.prezzo_acquisto_eur)}</td><td class="n">${x.sconto_campioni_pct?x.sconto_campioni_pct+"%":""}</td><td class="n">${eur(tot)}</td></tr>`; }).join("");
    const cred=(o.crediti||[]).reduce((a,x)=>a+(Number(x.importo)||0),0);
    return `<div class="tblw"><table><thead><tr><th>Vino</th><th class="n">Cartoni</th><th class="n">Bottiglie</th><th class="n">Prezzo</th><th class="n">Campioni</th><th class="n">Importo</th></tr></thead><tbody>${tr}
      ${camp?`<tr><td colspan="5">Sconto campioni</td><td class="n">−${eur(camp)}</td></tr>`:""}
      ${(o.crediti||[]).map(x=>`<tr><td colspan="5">${esc(x.descrizione||x.nota||"Nota di credito")}</td><td class="n">${eur(x.importo)}</td></tr>`).join("")}
      <tr class="tot"><td colspan="5">Totale (non imponibile art. 8)</td><td class="n">${eur(lordo-camp+cred)}</td></tr></tbody></table></div>`;
  }
  function ordini(){
    if(!O.length) return '<div class="card"><p class="empty">Al momento non ci sono ordini aperti.</p></div>';
    return O.map(o=>{ const i=fasi.findIndex(f=>f[0]===o.stato);
      return `<div class="card"><h2>Ordine ${esc(o.id)}</h2>
        <p class="muted">PO del ${dataIT(o.data)}${o.po_revisione?` · revisione ${esc(o.po_revisione)}`:""} · mercato ${esc((K.mercati||{})[o.mercato]||o.mercato||"")}${o.ritiro?` · ritiro previsto dal ${dataIT(o.ritiro)}`:""}</p>
        <div class="steps">${fasi.map((f,j)=>`<span class="${j<i?"done":j===i?"now":""}">${esc(f[1])}</span>`).join("")}</div>
        ${o.marcatura_bancali?`<p class="muted">Marcatura bancali: <b>${esc(o.marcatura_bancali)}</b></p>`:""}
        ${righe(o)}
        <h3 style="margin-top:18px">Merce pronta</h3>
        <p class="muted">Quando la merce è pronta, indicaci la data e i dati dei bancali: li giriamo allo spedizioniere.</p>
        <div class="form"><label>Data di prontezza<input type="date" data-k="data" data-o="${esc(o.id)}"></label><label>Numero bancali<input type="number" min="1" data-k="bancali" data-o="${esc(o.id)}"></label><label>Peso lordo totale (kg)<input type="number" min="0" data-k="peso" data-o="${esc(o.id)}"></label><label>Orari di carico<input type="text" data-k="orari" data-o="${esc(o.id)}" placeholder="es. 8:30-12:30"></label></div>
        <button class="btn pri" type="button" style="margin-top:12px" data-pronta="${esc(o.id)}">Invia i dati via email</button></div>`; }).join("");
  }
  function bindOrdini(){
    root.querySelectorAll("[data-pronta]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.pronta, v=k=>(root.querySelector(`[data-o="${id}"][data-k="${k}"]`)||{}).value||"";
      const body=`Buongiorno,\n\nper l'ordine ${id} la merce è pronta:\n- data: ${dataIT(v("data"))}\n- bancali: ${v("bancali")}\n- peso lordo: ${v("peso")} kg\n- orari di carico: ${v("orari")}\n\nUn saluto,\n${c.nome}`;
      location.href = mail(oggetto(id,"merce pronta"), body);
    });
  }
  function documenti(){
    const D = K.documenti_richiesti||[]; const ids = O.map(o=>o.id);
    return `<div class="card"><h2>Documenti richiesti</h2><p class="muted">Per ogni ordine servono questi documenti. Mandali via email con il pulsante: l'oggetto è già compilato con ordine e cantina.</p>
      ${D.map(x=>`<div class="doc"><div><b>${esc(x.nome)}</b><div class="small">Quando: ${esc(x.quando)}. ${esc(String(x.perche||"").charAt(0).toUpperCase()+String(x.perche||"").slice(1))}.</div></div>
        <div>${(ids.length?ids:[""]).map(o=>`<a class="btn sm" href="${mail(oggetto(o,x.nome),`Buongiorno,\n\nin allegato ${x.nome.toLowerCase()}${o?" per l'ordine "+o:""}.\n\nUn saluto,\n${c.nome}`)}">Invia${o?" per "+esc(o):""}</a>`).join(" ")}</div></div>`).join("")}</div>`;
  }
  function spedizione(){
    const I = d.istruzioni_spedizione||{}; const keys=Object.keys(I);
    if(!keys.length) return '<div class="card"><p class="empty">Le istruzioni arrivano con il primo ordine.</p></div>';
    const marca = (O.find(o=>o.marcatura_bancali)||{}).marcatura_bancali||"";
    return keys.map(k=>`<div class="card"><h2>${esc(I[k].area||k)}</h2><ul class="ist">${(I[k].righe||[]).map(r=>{ let t=r; if(marca){ t=t.replace("«{MARCA} - {ORDINE}»","«"+marca+"»").replace("{MARCA} - {ORDINE}",marca); } return `<li>${esc(t)}</li>`; }).join("")}</ul></div>`).join("");
  }
  function vini(){
    if(!V.length) return '<div class="card"><p class="empty">Nessun vino in archivio.</p></div>';
    return `<div class="card"><h2>I tuoi vini</h2><p class="muted">Prezzi concordati con Selcru, a bottiglia. Se annata o gradazione sono cambiate, scrivici: le aggiorniamo prima del prossimo PO.</p>
      <div class="tblw"><table><thead><tr><th>Vino</th><th>Annata</th><th class="n">Grado</th><th class="n">Prezzo</th><th class="n">Campioni</th></tr></thead><tbody>
      ${V.map(v=>`<tr><td>${esc(v.nome)}</td><td>${esc(v.annata||"")}</td><td class="n">${v.grado?v.grado+"%":""}</td><td class="n">${eur(v.prezzo_acquisto_eur)}</td><td class="n">${v.sconto_campioni_pct?v.sconto_campioni_pct+"%":""}</td></tr>`).join("")}</tbody></table></div>
      <a class="btn sm" style="margin-top:12px" href="${mail(oggetto("","aggiornamento vini"),"Buongiorno,\n\nvi segnaliamo questi aggiornamenti su annate e gradazioni:\n\n")}">Segnala un aggiornamento</a></div>`;
  }
  function dati(){
    const r=[["Ragione sociale",c.ragione],["Indirizzo",c.indirizzo],["Punto di ritiro",c.ritiro],["Referente",c.referente],["Email",c.email],["Telefono",c.tel],["Resa",c.resa],["Campioni",c.campioni!=null?c.campioni+"%":""],["Cartoni per bancale",c.cartPallet],["Bancale",c.pallet],["Orari di carico",c.carico]].filter(x=>x[1]);
    return `<div class="card"><h2>I tuoi dati</h2><div class="kv">${r.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>
      <a class="btn sm" style="margin-top:14px" href="${mail(oggetto("","aggiornamento dati"),"Buongiorno,\n\nvi segnaliamo questi aggiornamenti ai nostri dati:\n\n")}">Segnala una correzione</a></div>`;
  }
  draw();
}

loginView();
})();
</script>
</body>
</html>
